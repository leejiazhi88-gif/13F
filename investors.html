<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13F 大佬持仓一览</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #f0f3f5;
      --text: #18212b;
      --muted: #66727f;
      --line: #dce2e8;
      --ink: #0f1720;
      --green: #117b5b;
      --green-soft: #dff3eb;
      --blue: #2764a8;
      --blue-soft: #e4edf8;
      --amber: #9a6710;
      --amber-soft: #f6ecd8;
      --red: #b33a3a;
      --red-soft: #f8e6e3;
      --shadow: 0 14px 36px rgba(20, 32, 46, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }

    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247, 248, 250, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--ink);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      color: var(--ink);
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a,
    .filter,
    .period-select select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--surface);
      text-decoration: none;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      line-height: 1;
    }

    .period-select {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .period-select label {
      color: var(--muted);
      font-size: 12px;
    }

    .period-select select {
      color: var(--ink);
      cursor: pointer;
      min-width: 132px;
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 26px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
      gap: 24px;
      align-items: end;
    }

    h2 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.05;
      color: var(--ink);
    }

    .lead {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      max-width: 780px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 96px;
      background: #fbfcfd;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 14px;
      color: var(--ink);
      font-size: 25px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      margin: 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      cursor: pointer;
    }

    .filter.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .search {
      min-width: 260px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }

    .section {
      margin-top: 18px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .section h3 {
      margin: 0;
      color: var(--ink);
      font-size: 21px;
    }

    .section p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .group-chart {
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chart-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }

    .chart-head h4 {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
    }

    .chart-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .chart-wrap {
      padding: 14px 16px 8px;
    }

    .line-chart {
      display: block;
      width: 100%;
      height: 300px;
    }

    .axis text,
    .chart-label {
      fill: #53647a;
      font-size: 12px;
    }

    .grid-line {
      stroke: #dce2e8;
      stroke-width: 1;
    }

    .chart-point .chart-tooltip {
      pointer-events: none;
      transition: opacity 0.12s ease;
      overflow: visible;
    }

    .chart-point:hover .chart-tooltip,
    .chart-point:focus-within .chart-tooltip {
      opacity: 1;
      visibility: visible;
    }

    .chart-hit {
      fill: transparent;
      pointer-events: all;
    }

    .chart-tooltip-box {
      background: rgba(15, 23, 32, 0.94);
      border-radius: 8px;
      box-sizing: border-box;
      color: #fff;
      display: grid;
      gap: 4px;
      height: 100%;
      padding: 9px 10px;
      font-size: 12px;
      line-height: 1.35;
      box-shadow: 0 12px 26px rgba(15, 23, 32, 0.22);
      width: 100%;
    }

    .chart-tooltip-box strong {
      font-size: 13px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .chart-tooltip-box span {
      color: rgba(255, 255, 255, 0.8);
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 10px 16px 14px;
      border-top: 1px solid var(--line);
      color: #43566f;
      font-size: 12px;
    }

    .chart-narrative {
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      background: #fbfcfd;
    }

    .narrative-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
      min-height: 112px;
    }

    .narrative-card b {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .narrative-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .group-insight {
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f7faf8;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .group-insight-head {
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .group-insight-head h4 {
      margin: 0;
      color: var(--ink);
      font-size: 18px;
    }

    .group-insight-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .group-insight-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    .group-insight-item {
      background: var(--surface);
      padding: 14px;
      min-height: 146px;
    }

    .group-insight-item b {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 7px;
    }

    .group-insight-item p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .group-insight-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .group-insight-tags span {
      border: 1px solid #d5e1d9;
      border-radius: 999px;
      background: #f4faf6;
      color: #2d5e46;
      font-size: 11px;
      line-height: 1;
      padding: 6px 8px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    .card-chart {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .card-chart-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .card-chart-head h4 {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.25;
    }

    .card-chart-head span {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .card-line-chart {
      display: block;
      width: 100%;
      height: 260px;
    }

    .card-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 10px;
      color: #43566f;
      font-size: 11px;
      line-height: 1.25;
    }

    .card-chart .chart-narrative {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card-chart .narrative-card {
      box-shadow: none;
      min-height: 104px;
    }

    .card-legend .legend-swatch {
      width: 8px;
      height: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card.featured {
      grid-column: 1 / -1;
      min-height: 560px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .names strong {
      display: block;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.25;
    }

    .names a {
      display: inline-block;
      max-width: 100%;
      text-decoration: none;
    }

    .names a:hover strong {
      color: var(--blue);
    }

    .names span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .badge {
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      color: var(--blue);
      background: var(--blue-soft);
    }

    .badge.cn {
      color: var(--green);
      background: var(--green-soft);
    }

    .status {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .status span {
      color: var(--muted);
      font-size: 12px;
    }

    .status strong {
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pill {
      justify-self: end;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      color: var(--amber);
      background: var(--amber-soft);
      white-space: nowrap;
    }

    .pill.ready {
      color: var(--green);
      background: var(--green-soft);
    }

    .meta {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .meta b {
      color: var(--text);
      font-weight: 650;
    }

    .focus {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .focus span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 7px;
      color: var(--muted);
      background: #fbfcfd;
      font-size: 12px;
      line-height: 1;
    }

    .holdings {
      border-top: 1px solid var(--line);
      padding-top: 11px;
      display: grid;
      gap: 7px;
    }

    .holding-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .holding-row b {
      overflow: hidden;
      color: var(--text);
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .holding-row span {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .note {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .footer-note {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.65;
    }

    @media (max-width: 980px) {
      .hero,
      .cards {
        grid-template-columns: 1fr;
      }

      .card.featured {
        grid-column: auto;
      }

      .group-insight-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      main { padding: 16px; }
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 16px;
      }
      .nav {
        width: 100%;
        justify-content: flex-start;
      }
      .hero { padding: 20px; }
      .summary-grid { grid-template-columns: 1fr; }
      .search { width: 100%; min-width: 0; }
      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }
      .chart-narrative {
        grid-template-columns: 1fr;
      }
      .card-chart .chart-narrative {
        grid-template-columns: 1fr;
      }
      .group-insight-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="mark">13F</div>
        <div>
          <h1>13F 大佬持仓一览</h1>
          <span>20 个重点管理人 · 分类聚类 · 统一报告期</span>
        </div>
      </div>
      <nav class="nav">
        <div class="period-select">
          <label for="period-select">选择时期</label>
          <select id="period-select" aria-label="选择 13F 报告期"></select>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h2>把 20 个值得跟踪的 13F 管理人放在一张页面里</h2>
        <p class="lead">这页先解决“跟踪谁”和“按什么风格看”的问题。顶部时期切换会统一作用到所有卡片；目前 Berkshire 已接入本地季度数据，其他管理人先作为待抓取对象，后续可以逐个接入 SEC 13F 原始表。</p>
      </div>
      <div class="summary-grid" id="summary"></div>
    </section>

    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <input class="search" id="search" placeholder="搜索中文名、英文名、申报主体、风格">
    </div>

    <div id="sections"></div>

    <p class="footer-note">说明：13F 只覆盖 SEC 13F 范围内的美国上市证券、多头仓位和部分期权，不代表基金完整资产，也不能直接等同于投资建议。量化和多策略机构尤其适合看风险敞口与拥挤度，不适合简单照单抄作业。</p>
  </main>

        return segment.map((point, index) => `${index ? "L" : "M"} ${point.x} ${point.y}`).join(" ");

            <title>${manager.zh} 13F 市值趋势</title>
          </path>
          ${points.filter(point => point.value != null).map((point, index) => {
            const tooltipLines = [manager.zh, point.period, `13F 市值：${chartValueLabel(point.value)}`];
            const tooltipBox = tooltipSize(tooltipLines);
            const tooltip = tooltipPosition(point.x, point.y, width, height, tooltipBox.width, tooltipBox.height);
            return `
              <g class="chart-point">
                <circle class="chart-hit" cx="${point.x}" cy="${point.y}" r="15"></circle>
                <circle cx="${point.x}" cy="${point.y}" r="${manager.localData === "berkshire" ? 3.5 : 4}" fill="${color}" stroke="#fff" stroke-width="1.5"></circle>
                <foreignObject class="chart-tooltip" x="${tooltip.x.toFixed(1)}" y="${tooltip.y.toFixed(1)}" width="${tooltipBox.width}" height="${tooltipBox.height}" opacity="0" visibility="hidden">
                  ${chartTooltip(tooltipLines)}
                </foreignObject>
              </g>
            `;
          }).join("")}
        `;
      }).join("");
      const narrative = groupTrendNarrative(drawableRows, periods);

      return `
        <div class="group-chart">
          <div class="chart-head">
            <div>
              <h4>13F 市值趋势</h4>
              <p>Berkshire 使用本地 2016Q2-2026Q2 完整季度数据；其余管理人历史季度补齐后会自动加入同一时间轴。</p>
            </div>
            <p>当前高亮：${activePeriod}</p>
          </div>
          <div class="chart-wrap">
            <svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${group} 13F 市值趋势">
              ${ticks.map(tick => {
                const ty = y(tick).toFixed(1);
                return `
                  <line class="grid-line" x1="${pad.left}" x2="${width - pad.right}" y1="${ty}" y2="${ty}"></line>
                  <text class="chart-label" x="${pad.left - 12}" y="${Number(ty) + 4}" text-anchor="end">${chartValueLabel(tick)}</text>
                `;
              }).join("")}
              ${activeIndex >= 0 ? `<rect x="${x(activeIndex) - 15}" y="${pad.top}" width="30" height="${plotH}" fill="#e4edf8" opacity="0.55" rx="4"></rect>` : ""}
              ${lines}
              ${periods.map((period, index) => (
                index === 0 || index === periods.length - 1 || index === activeIndex || index % labelStep === 0
                  ? `<text class="chart-label" x="${x(index).toFixed(1)}" y="${height - 14}" text-anchor="middle">${shortPeriod(period.period)}</text>`
                  : ""
              )).join("")}
            </svg>
          </div>
          <div class="chart-legend">
            ${drawableRows.map((manager, index) => `
              <span class="legend-item"><i class="legend-swatch" style="background:${chartColors[index % chartColors.length]}"></i>${manager.zh}</span>
            `).join("")}
          </div>
          ${narrative}
        </div>
      `;
    }

    function groupTrendNarrative(managers, periods) {
      const activeIndex = periods.findIndex(period => period.period === activePeriod);
      if (activeIndex <= 0) return "";
      const previousPeriod = periods[activeIndex - 1].period;
      const rows = managers.map(manager => {
        const current = managerValueForPeriod(manager, activePeriod);
        const previous = managerValueForPeriod(manager, previousPeriod);
        if (current == null || previous == null || previous === 0) return null;
        return {
          manager,
          current,
          previous,
          delta: current - previous,
          pct: (current - previous) / previous
        };
      }).filter(Boolean);
      if (!rows.length) return "";

      const totalCurrent = rows.reduce((sum, row) => sum + row.current, 0);
      const totalPrevious = rows.reduce((sum, row) => sum + row.previous, 0);
      const totalDelta = totalCurrent - totalPrevious;
      const totalPct = totalPrevious ? totalDelta / totalPrevious : 0;
      const sortedAbs = [...rows].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      const biggest = sortedAbs[0];
      const winners = rows.filter(row => row.delta > 0).sort((a, b) => b.delta - a.delta);
      const losers = rows.filter(row => row.delta < 0).sort((a, b) => a.delta - b.delta);
      const direction = totalDelta >= 0 ? "扩张" : "收缩";
      const biggestText = `${biggest.manager.zh}${biggest.delta >= 0 ? "增加" : "减少"} ${chartValueLabel(Math.abs(biggest.delta))}`;
      const winnerText = winners.length ? `上升端主要来自 ${winners.slice(0, 2).map(row => `${row.manager.zh} +${chartValueLabel(row.delta)}`).join("、")}。` : "这组样本本季没有明显扩张者。";
      const loserText = losers.length ? `下降端主要来自 ${losers.slice(0, 2).map(row => `${row.manager.zh} -${chartValueLabel(Math.abs(row.delta))}`).join("、")}。` : "这组样本本季没有明显收缩者。";
      const tci = rows.find(row => row.manager.historyKey === "tci");
      const berkshire = rows.find(row => row.manager.localData === "berkshire");
      const rootCauseParts = [];
      if (berkshire && berkshire.delta < 0) rootCauseParts.push("Berkshire 的 13F 市值下行，更多反映公开股票组合市值和局部减仓共同作用；现金/短债不计入 13F。");
      if (tci && tci.delta < 0) rootCauseParts.push("TCI 本季回落幅度较大，和高度集中组合中 Microsoft 等权重变化、核心质量股价格波动有关。");
      if (!rootCauseParts.length) rootCauseParts.push("13F 市值变化通常由两件事叠加：管理人真实买卖，以及季度末持仓标的价格重估；这张图不能单独拆出两者比例。");
      const nextWatch = winners.length && losers.length
        ? `下个 Q 重点看这次收缩是否延续：${losers[0].manager.zh} 是否继续降权，以及 ${winners[0].manager.zh} 的扩张是否来自新增持仓还是价格修复。`
        : `下个 Q 重点看整体 ${direction} 是否延续，以及当前最大变化项 ${biggest.manager.zh} 是否出现反向修复。`;

      return `
        <div class="chart-narrative">
          <div class="narrative-card">
            <b>最近这个 Q 发生了什么</b>
            <p>${activePeriod} 相比 ${previousPeriod}，这组 13F 总市值整体${direction} ${chartValueLabel(Math.abs(totalDelta))}（${totalPct >= 0 ? "+" : "-"}${Math.abs(totalPct * 100).toFixed(1)}%）。最大变化是 ${biggestText}。${winnerText} ${loserText}</p>
          </div>
          <div class="narrative-card">
            <b>背后的可能根因</b>
            <p>${rootCauseParts.join(" ")}</p>
          </div>
          <div class="narrative-card">
            <b>下个 Q 的观察点</b>
            <p>${nextWatch} 还要特别留意：13F 有披露延迟，下一季真实信号要和个股价格、清仓/新进表一起交叉验证。</p>
          </div>
        </div>
      `;
    }

    function renderGroupInsight(group, rows) {
      if (group !== "价值与集中持仓") return "";
      const periods = availablePeriods();
      const activeIndex = periods.findIndex(period => period.period === activePeriod);
      const previousPeriod = activeIndex > 0 ? periods[activeIndex - 1].period : null;
      const currentRows = rows.map(manager => {
        const state = managerState(manager);
        const current = managerValueForPeriod(manager, activePeriod);
        const previous = previousPeriod ? managerValueForPeriod(manager, previousPeriod) : null;
        return { manager, state, current, previous };
      }).filter(row => row.state.ready && Number.isFinite(row.current));
      if (!currentRows.length) return "";

      const comparableRows = currentRows.filter(row => Number.isFinite(row.previous) && row.previous > 0).map(row => ({
        ...row,
        delta: row.current - row.previous,
        pct: (row.current - row.previous) / row.previous
      }));
      const totalCurrent = currentRows.reduce((sum, row) => sum + row.current, 0);
      const totalPrevious = comparableRows.reduce((sum, row) => sum + row.previous, 0);
      const totalDelta = comparableRows.reduce((sum, row) => sum + row.delta, 0);
      const totalPct = totalPrevious ? totalDelta / totalPrevious : 0;
      const avgTop10Rows = currentRows.filter(row => row.state.data && Number.isFinite(row.state.data.top10));
      const avgTop10 = avgTop10Rows.length
        ? avgTop10Rows.reduce((sum, row) => sum + row.state.data.top10, 0) / avgTop10Rows.length
        : null;
      const sortedMoves = [...comparableRows].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      const largestMove = sortedMoves[0] || null;
      const risers = comparableRows.filter(row => row.delta > 0).sort((a, b) => b.delta - a.delta);
      const fallers = comparableRows.filter(row => row.delta < 0).sort((a, b) => a.delta - b.delta);

      const focusCounts = new Map();
      currentRows.forEach(row => {
        row.manager.focus.forEach(item => focusCounts.set(item, (focusCounts.get(item) || 0) + 1));
      });
      const focusTags = [...focusCounts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 6)
        .map(([name]) => name);
      const topHoldings = currentRows.flatMap(row => {
        const top = row.state.data && row.state.data.top ? row.state.data.top : [];
        return top.slice(0, 3).map(item => ({
          manager: row.manager.zh,
          name: holdingLabel(item[1] || item[0]),
          weight: item[2]
        }));
      }).filter(item => Number.isFinite(item.weight))
        .sort((a, b) => b.weight - a.weight)
        .slice(0, 5);
      const topHoldingText = topHoldings.length
        ? topHoldings.map(item => `${item.name}（${item.manager} ${item.weight.toFixed(1)}%）`).join("、")
        : "当前季度尚无足够核心持仓明细";
      const signalText = currentRows
        .map(row => row.state.data && row.state.data.signal ? `${row.manager.zh}：${row.state.data.signal}` : "")
        .filter(Boolean)
        .slice(0, 3)
        .join(" ");

      let riskText;
      if (!comparableRows.length) {
        riskText = `${activePeriod} 这组已披露 13F 合计约 ${chartValueLabel(totalCurrent)}，但缺少上一季度可比数据，风险判断更适合先看集中度和持仓结构。`;
      } else if (totalPct < -0.08) {
        riskText = `${activePeriod} 相比 ${previousPeriod}，可比样本 13F 市值收缩 ${chartValueLabel(Math.abs(totalDelta))}（-${Math.abs(totalPct * 100).toFixed(1)}%），整体不像在追高扩表，更偏向降低公开股票暴露、控制单一仓位波动。`;
      } else if (totalPct > 0.08) {
        riskText = `${activePeriod} 相比 ${previousPeriod}，可比样本 13F 市值扩张 ${chartValueLabel(totalDelta)}（+${(totalPct * 100).toFixed(1)}%），但扩张仍集中在少数高确信度资产，不是分散式全面加风险。`;
      } else {
        riskText = `${activePeriod} 相比 ${previousPeriod}，可比样本 13F 市值变化 ${totalPct >= 0 ? "+" : "-"}${Math.abs(totalPct * 100).toFixed(1)}%，整体更像稳住核心仓位、在个别标的上做再平衡。`;
      }
      const concentrationText = avgTop10
        ? `当前可见样本前十大平均约 ${avgTop10.toFixed(1)}%，集中度本身就是这组人的主要风险来源：看对时弹性强，看错时回撤也会更集中。`
        : "这组人的共同点不是持仓数量多，而是把风险集中压在少数高确信度判断上。";
      const distributionText = `分布偏好仍围绕 ${focusTags.join("、")}。从前排持仓看，核心不是短线题材铺开，而是现金流质量、平台型公司、消费/金融基础设施和少数周期价值机会。代表性持仓包括 ${topHoldingText}。`;
      const moveText = largestMove
        ? `最大异动来自 ${largestMove.manager.zh}：13F 市值${largestMove.delta >= 0 ? "增加" : "减少"} ${chartValueLabel(Math.abs(largestMove.delta))}。上升端 ${risers.length ? risers.slice(0, 2).map(row => `${row.manager.zh} +${chartValueLabel(row.delta)}`).join("、") : "不明显"}；下降端 ${fallers.length ? fallers.slice(0, 2).map(row => `${row.manager.zh} -${chartValueLabel(Math.abs(row.delta))}`).join("、") : "不明显"}。${signalText}`
        : `${activePeriod} 暂时没有足够的上一季数据比较异动，先以当前核心持仓结构作为方向线索。${signalText}`;
      const boundaryText = "13F 只能看到披露范围内的美国上市证券多头和部分期权，不能直接读取现金、短债、空仓比例或海外/私募资产。市值变化还混合了真实买卖和季度末股价重估，所以这里的方向性更适合作为观察清单，而不是单独下结论。";

      return `
        <div class="group-insight">
          <div class="group-insight-head">
            <div>
              <h4>价值与集中持仓：本 Q 组合画像</h4>
              <p>把这组大佬放在一起看，重点不是“谁买了哪只股票”，而是他们如何处理集中度、估值和公开股票风险。</p>
            </div>
            <p>${activePeriod} · 已接入 ${currentRows.length} 位/家</p>
          </div>
          <div class="group-insight-grid">
            <div class="group-insight-item">
              <b>风险态度</b>
              <p>${riskText} ${concentrationText}</p>
            </div>
            <div class="group-insight-item">
              <b>分布偏好</b>
              <p>${distributionText}</p>
              <div class="group-insight-tags">${focusTags.map(item => `<span>${item}</span>`).join("")}</div>
            </div>
            <div class="group-insight-item">
              <b>异动方向</b>
              <p>${moveText}</p>
            </div>
            <div class="group-insight-item">
              <b>解读边界</b>
              <p>${boundaryText}</p>
            </div>
          </div>
        </div>
      `;
    }

    function shortPeriod(period) {
      return period.replace("20", "").replace(" Q", "Q");
    }

    function slugifyManager(manager) {
      return (manager.historyKey || manager.firm || manager.en)
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function outputPrefix() {
      return window.location.pathname.includes("/outputs/") ? "" : "outputs/";
    }

    function managerProfileHref(manager) {
      if (manager.localData === "berkshire") return `${outputPrefix()}berkshire_13f_single_file.html`;
      return `${outputPrefix()}investor_${slugifyManager(manager)}.html`;
    }

    function managerHoldingNarrative(manager, series, periods) {
      const activeIndex = periods.findIndex(period => period.period === activePeriod);
      if (activeIndex <= 0) return "";
      const currentPeriod = periods[activeIndex].period;
      const previousPeriod = periods[activeIndex - 1].period;
      const rows = series.map(row => {
        const current = row.points.find(point => point.period === currentPeriod);
        const previous = row.points.find(point => point.period === previousPeriod);
        if (!current || !previous || current.weight == null || previous.weight == null) return null;
        return {
          row,
          current,
          previous,
          delta: current.weight - previous.weight,
          valueDelta: (current.value || 0) - (previous.value || 0)
        };
      }).filter(Boolean);
      if (!rows.length) return "";
      const sorted = [...rows].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      const biggest = sorted[0];
      const risers = rows.filter(item => item.delta > 0).sort((a, b) => b.delta - a.delta);
      const fallers = rows.filter(item => item.delta < 0).sort((a, b) => a.delta - b.delta);
      const concentration = series
        .filter(row => row.kind !== "cash" && row.kind !== "remainder")
        .reduce((sum, row) => {
          const point = row.points.find(item => item.period === currentPeriod);
          return sum + (point && point.weight ? point.weight : 0);
        }, 0);
      const biggestName = biggest.row.displayName || biggest.row.name;
      const biggestMove = `${biggestName}${biggest.delta >= 0 ? "上升" : "下降"} ${Math.abs(biggest.delta * 100).toFixed(1)} 个百分点`;
      const riseText = risers.length ? `上升项：${risers.slice(0, 2).map(item => `${item.row.displayName || item.row.name} +${(item.delta * 100).toFixed(1)}pp`).join("、")}。` : "没有明显上升项。";
      const fallText = fallers.length ? `下降项：${fallers.slice(0, 2).map(item => `${item.row.displayName || item.row.name} ${(item.delta * 100).toFixed(1)}pp`).join("、")}。` : "没有明显下降项。";
      let cause;
      if (manager.localData === "berkshire") {
        const cash = rows.find(item => item.row.kind === "cash");
        const apple = rows.find(item => item.row.name === "APPLE INC");
        cause = cash && cash.delta > 0
          ? "现金/短债权重继续抬升，通常来自股票组合压缩、经营现金留存和短债再配置；Apple 权重变化则同时受减持与股价重估影响。"
          : apple && apple.delta < 0
          ? "Apple 权重下降仍是核心变量之一，背后可能是继续降低单一股票集中度，以及季度末价格重估。"
          : "Berkshire 的权重变化要同时看股票买卖、股价重估和财报现金/短债，13F 本身不覆盖现金。";
      } else {
        cause = "这里展示的是 13F 已披露证券内部的权重变化；“其他13F持仓”不是现金，真实现金/空仓无法从 13F 直接读取。权重变化通常来自买卖和季度末价格重估的叠加。";
      }
      const outlook = fallers.length && risers.length
        ? `下个 Q 重点看 ${fallers[0].row.displayName || fallers[0].row.name} 的下降是否延续，以及 ${risers[0].row.displayName || risers[0].row.name} 的上升是新增/加仓还是价格修复。`
        : `下个 Q 重点看 ${biggestName} 是否反向修复，以及前 6 大合计集中度是否继续维持在 ${(concentration * 100).toFixed(1)}% 附近。`;

      return `
        <div class="chart-narrative">
          <div class="narrative-card">
            <b>最近这个 Q 发生了什么</b>
            <p>${currentPeriod} 相比 ${previousPeriod}，核心曲线里最大变化是 ${biggestMove}。${riseText} ${fallText}</p>
          </div>
          <div class="narrative-card">
            <b>背后的可能根因</b>
            <p>${cause}</p>
          </div>
          <div class="narrative-card">
            <b>下个 Q 的观察点</b>
            <p>${outlook} 同时结合完整持仓表里的新进、清仓和股数变化验证。</p>
          </div>
        </div>
      `;
    }

    function renderManagerChart(manager) {
      if (manager.localData !== "berkshire") {
        const history = manager.historyKey && typeof INVESTOR_HISTORY !== "undefined" ? INVESTOR_HISTORY[manager.historyKey] : null;
        const trend = history && history._coreTrend ? history._coreTrend : null;
        if (!trend || !trend.periods || !trend.series || !trend.series.length) return "";
        const periods = trend.periods;
        const series = trend.series.slice(0, 6).map(row => ({
          ...row,
          displayName: holdingLabel(row.name),
          kind: "stock"
        }));
        const remainderSeries = {
          name: "其他13F持仓",
          displayName: "其他13F持仓",
          kind: "remainder",
          points: periods.map(period => {
            const visibleValue = series.reduce((sum, row) => {
              const point = row.points.find(item => item.period === period.period);
              return sum + (point ? point.value : 0);
            }, 0);
            const total = period.totalValue || 0;
            const value = Math.max(0, total - visibleValue);
            return {
              period: period.period,
              reportDate: period.reportDate,
              value,
              weight: total ? value / total : null
            };
          })
        };
        series.push(remainderSeries);
        const values = [];
        series.forEach(row => {
          row.points.forEach(point => {
            if (point.weight != null) values.push(point.weight);
          });
        });
        if (values.length < 2) return "";

        const width = 620;
        const height = 190;
        const pad = { left: 38, right: 10, top: 14, bottom: 28 };
        const plotW = width - pad.left - pad.right;
        const plotH = height - pad.top - pad.bottom;
        const scaleMax = Math.max(0.55, Math.max(...values) * 1.06);
        const x = index => pad.left + (periods.length === 1 ? 0 : (index / (periods.length - 1)) * plotW);
        const y = value => pad.top + (1 - (value / scaleMax)) * plotH;
        const ticks = [0, 0.25, 0.5, 0.75, 1].map(ratio => scaleMax * ratio);
        const labelStep = Math.max(1, Math.ceil(periods.length / 9));
        const activeIndex = periods.findIndex(period => period.period === activePeriod);
        const lines = series.map((row, seriesIndex) => {
          const points = periods.map((period, periodIndex) => {
            const point = row.points.find(item => item.period === period.period);
            const value = point ? point.weight : null;
            return {
              x: x(periodIndex).toFixed(1),
              y: value == null ? null : y(value).toFixed(1),
              value,
              amount: point ? point.value : 0,
              period: period.period,
              reportDate: period.reportDate
            };
          });
          const color = chartColors[seriesIndex % chartColors.length];
          const dash = row.kind === "remainder" ? `stroke-dasharray="6 5"` : "";
          return `
            <path d="${pointPath(points)}" fill="none" stroke="${color}" stroke-width="${row.kind === "remainder" ? "2.3" : "2.1"}" ${dash} stroke-linecap="round" stroke-linejoin="round">
              <title>${row.displayName} 权重趋势</title>
            </path>
            ${points.filter(point => point.value != null).map(point => {
              const tooltipLines = row.kind === "remainder"
                ? [row.displayName, point.period, `权重：${(point.value * 100).toFixed(1)}%`, `市值：${chartValueLabel(point.amount)}`, "13F 不披露现金，不能等同现金/空仓"]
                : [row.displayName, point.period, `权重：${(point.value * 100).toFixed(1)}%`, `市值：${chartValueLabel(point.amount)}`];
              const tooltipBox = tooltipSize(tooltipLines);
              const tooltip = tooltipPosition(point.x, point.y, width, height, tooltipBox.width, tooltipBox.height);
              return `
                <g class="chart-point">
                  <circle class="chart-hit" cx="${point.x}" cy="${point.y}" r="13"></circle>
                  <circle cx="${point.x}" cy="${point.y}" r="${row.kind === "remainder" ? "3.2" : "2.7"}" fill="${color}" stroke="#fff" stroke-width="1.2"></circle>
                  <foreignObject class="chart-tooltip" x="${tooltip.x.toFixed(1)}" y="${tooltip.y.toFixed(1)}" width="${tooltipBox.width}" height="${tooltipBox.height}" opacity="0" visibility="hidden">
                    ${chartTooltip(tooltipLines)}
                  </foreignObject>
                </g>
              `;
            }).join("")}
          `;
        }).join("");
        const narrative = managerHoldingNarrative(manager, series, periods);

        return `
          <div class="card-chart">
            <div class="card-chart-head">
              <h4>核心持仓权重趋势</h4>
              <span>含其他13F持仓 · ${shortPeriod(periods[0].period)}-${shortPeriod(periods[periods.length - 1].period)}</span>
            </div>
            <svg class="card-line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${manager.zh} 核心持仓权重趋势">
              ${ticks.map(tick => {
                const ty = y(tick).toFixed(1);
                return `
                  <line class="grid-line" x1="${pad.left}" x2="${width - pad.right}" y1="${ty}" y2="${ty}"></line>
                  <text class="chart-label" x="${pad.left - 8}" y="${Number(ty) + 4}" text-anchor="end">${Math.round(tick * 100)}%</text>
                `;
              }).join("")}
              ${activeIndex >= 0 ? `<rect x="${x(activeIndex) - 8}" y="${pad.top}" width="16" height="${plotH}" fill="#e4edf8" opacity="0.5" rx="3"></rect>` : ""}
              ${lines}
              ${periods.map((period, index) => (
                index === 0 || index === periods.length - 1 || index === activeIndex || index % labelStep === 0
                  ? `<text class="chart-label" x="${x(index).toFixed(1)}" y="${height - 9}" text-anchor="middle">${shortPeriod(period.period)}</text>`
                  : ""
              )).join("")}
            </svg>
            <div class="card-legend">
              ${series.map((row, index) => `
                <span class="legend-item" title="${row.kind === "remainder" ? "13F 不披露现金，不能等同现金/空仓" : row.name}">
                  <i class="legend-swatch" style="background:${chartColors[index % chartColors.length]}"></i>${row.displayName}
                </span>
              `).join("")}
            </div>
            ${narrative}
          </div>
        `;
      }
      if (typeof TREND_DATA === "undefined") return "";
      const periods = TREND_DATA.periods;
      const stockSeries = TREND_DATA.series.slice(0, 6).map(row => ({
        ...row,
        displayName: holdingLabel(row.name),
        kind: "stock"
      }));
      const cashSeries = {
        name: "现金/空仓",
        displayName: "现金/空仓",
        kind: "cash",
        points: periods.map(period => {
          const snapshot = PERIOD_SNAPSHOTS.find(item => item.period === period.period);
          const cash = berkshireCashAndTbills[period.period];
          const total = snapshot && cash ? snapshot.totalValue + cash : null;
          return {
            period: period.period,
            reportDate: period.reportDate,
            value: cash,
            weight: total ? cash / total : null
          };
        })
      };
      const series = [...stockSeries, cashSeries];
      const values = [];
      series.forEach(row => {
        row.points.forEach(point => {
          if (point.weight != null) values.push(point.weight);
        });
      });

      const width = 620;
      const height = 190;
      const pad = { left: 38, right: 10, top: 14, bottom: 28 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const scaleMax = Math.max(0.55, Math.max(...values) * 1.06);
      const x = index => pad.left + (periods.length === 1 ? 0 : (index / (periods.length - 1)) * plotW);
      const y = value => pad.top + (1 - (value / scaleMax)) * plotH;
      const ticks = [0, 0.25, 0.5, 0.75, 1].map(ratio => scaleMax * ratio);
      const labelStep = Math.max(1, Math.ceil(periods.length / 9));

      const lines = series.map((row, seriesIndex) => {
        const points = periods.map((period, periodIndex) => {
          const point = row.points.find(item => item.period === period.period);
          const value = point ? point.weight : null;
          return {
            x: x(periodIndex).toFixed(1),
            y: value == null ? null : y(value).toFixed(1),
            value,
            period: period.period
          };
        });
        const color = chartColors[seriesIndex % chartColors.length];
        const dash = row.kind === "cash" ? `stroke-dasharray="6 5"` : "";
        return `
          <path d="${pointPath(points)}" fill="none" stroke="${color}" stroke-width="${row.kind === "cash" ? "2.4" : "2.1"}" ${dash} stroke-linecap="round" stroke-linejoin="round">
            <title>${row.displayName} 权重趋势</title>
          </path>
          ${points.filter(point => point.value != null).map((point, index) => {
            const tooltipLines = row.kind === "cash"
              ? [row.displayName, point.period, `比例：${(point.value * 100).toFixed(1)}%`, "现金/短债 ÷ (现金/短债 + 13F 市值)"]
              : [row.displayName, point.period, `权重：${(point.value * 100).toFixed(1)}%`];
            const tooltipBox = tooltipSize(tooltipLines);
            const tooltip = tooltipPosition(point.x, point.y, width, height, tooltipBox.width, tooltipBox.height);
            return `
              <g class="chart-point">
                <circle class="chart-hit" cx="${point.x}" cy="${point.y}" r="13"></circle>
                <circle cx="${point.x}" cy="${point.y}" r="${row.kind === "cash" ? "3.2" : "2.5"}" fill="${color}" stroke="#fff" stroke-width="1.2"></circle>
                <foreignObject class="chart-tooltip" x="${tooltip.x.toFixed(1)}" y="${tooltip.y.toFixed(1)}" width="${tooltipBox.width}" height="${tooltipBox.height}" opacity="0" visibility="hidden">
                  ${chartTooltip(tooltipLines)}
                </foreignObject>
              </g>
            `;
          }).join("")}
        `;
      }).join("");
      const narrative = managerHoldingNarrative(manager, series, periods);

      return `
        <div class="card-chart">
          <div class="card-chart-head">
            <h4>核心持仓权重趋势</h4>
            <span>含现金/空仓 · ${shortPeriod(periods[0].period)}-${shortPeriod(periods[periods.length - 1].period)}</span>
          </div>
          <svg class="card-line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${manager.zh} 核心持仓权重趋势">
            ${ticks.map(tick => {
              const ty = y(tick).toFixed(1);
              return `
                <line class="grid-line" x1="${pad.left}" x2="${width - pad.right}" y1="${ty}" y2="${ty}"></line>
                <text class="chart-label" x="${pad.left - 8}" y="${Number(ty) + 4}" text-anchor="end">${Math.round(tick * 100)}%</text>
              `;
            }).join("")}
            ${lines}
            ${periods.map((period, index) => (
              index === 0 || index === periods.length - 1 || index % labelStep === 0
                ? `<text class="chart-label" x="${x(index).toFixed(1)}" y="${height - 9}" text-anchor="middle">${shortPeriod(period.period)}</text>`
                : ""
            )).join("")}
          </svg>
          <div class="card-legend">
            ${series.map((row, index) => `
              <span class="legend-item" title="${row.kind === "cash" ? "现金/短期国债 ÷ (现金/短期国债 + 13F 市值)" : row.name}">
                <i class="legend-swatch" style="background:${chartColors[index % chartColors.length]}"></i>${row.displayName}
              </span>
            `).join("")}
          </div>
          ${narrative}
        </div>
      `;
    }

    function filteredManagers() {
      const q = query.trim().toLowerCase();
      return managers
        .filter(item => activeGroup === "全部" || item.group === activeGroup)
        .filter(item => {
          if (!q) return true;
          return [item.zh, item.en, item.firm, item.style, item.group, item.focus.join(" ")]
            .join(" ")
            .toLowerCase()
            .includes(q);
        });
    }

    function renderSummary() {
      const cnCount = managers.filter(item => item.cn).length;
      const readyCount = managers.filter(item => managerState(item).ready).length;
      const meta = periodMeta();
      document.getElementById("summary").innerHTML = `
        <div class="metric"><span>本页覆盖</span><strong>${managers.length}</strong></div>
        <div class="metric"><span>聚类分组</span><strong>${Object.keys(groupDescriptions).length}</strong></div>
        <div class="metric"><span>中国/华人背景</span><strong>${cnCount}</strong></div>
        <div class="metric"><span>${meta.reportDate} 已接入</span><strong>${readyCount}/${managers.length}</strong></div>
      `;
    }

    function renderFilters() {
      document.getElementById("filters").innerHTML = groupOrder.map(group => `
        <button class="filter ${group === activeGroup ? "active" : ""}" data-group="${group}" type="button">${group}</button>
      `).join("");
      document.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          activeGroup = button.dataset.group;
          renderFilters();
          renderSections();
        });
      });
    }

    function card(manager) {
      const state = managerState(manager);
      const topRows = state.data && state.data.top ? state.data.top : [];
      return `
        <article class="card ${manager.localData === "berkshire" || manager.historyKey ? "featured" : ""}">
          <div class="card-top">
            <div class="names">
              <a href="${managerProfileHref(manager)}"><strong>${manager.zh}</strong></a>
              <span>${manager.en}</span>
            </div>
            <span class="badge ${manager.cn ? "cn" : ""}">${manager.tag}</span>
          </div>
          <div class="status">
            <span>${activePeriod} 13F 市值</span>
            <span class="pill ${state.ready ? "ready" : ""}">${state.status}</span>
            <strong>${amountLabel(state.value)}</strong>
            <span>${state.caption}${state.data && state.data.holdings ? ` · ${state.data.holdings} 个持仓` : ""}</span>
          </div>
          <div class="meta">
            <div><b>申报主体：</b>${manager.firm}</div>
            <div><b>风格：</b>${manager.style}</div>
            ${state.data && state.data.top10 ? `<div><b>集中度：</b>前十大约 ${state.data.top10.toFixed(1)}%</div>` : ""}
            <div class="focus">${manager.focus.map(item => `<span>${item}</span>`).join("")}</div>
          </div>
          ${topRows.length ? `
            <div class="holdings">
              ${topRows.map(row => `
                <div class="holding-row">
                  <b>${row[0]} · ${row[1]}</b>
                  <span>${row[2].toFixed(1)}%</span>
                </div>
              `).join("")}
            </div>
          ` : ""}
          ${renderManagerChart(manager)}
          ${state.data && state.data.signal ? `<div class="note">${state.data.signal}</div>` : `<div class="note">${manager.note}</div>`}
        </article>
      `;
    }

    function renderSections() {
      const data = filteredManagers();
      const groups = activeGroup === "全部" ? Object.keys(groupDescriptions) : [activeGroup];
      document.getElementById("sections").innerHTML = groups.map(group => {
        const rows = data.filter(item => item.group === group);
        if (!rows.length) return "";
        return `
          <section class="section">
            <div class="section-head">
              <div>
                <h3>${group}</h3>
                <p>${groupDescriptions[group]}</p>
              </div>
              <p>${rows.length} 位/家 · 当前时期 ${activePeriod}</p>
            </div>
            ${renderGroupChart(group, rows)}
            ${renderGroupInsight(group, rows)}
            <div class="cards">${rows.map(card).join("")}</div>
          </section>
        `;
      }).join("") || `<section class="section"><p>没有匹配结果。</p></section>`;
    }

    function render() {
      renderSummary();
      renderFilters();
      renderSections();
    }

    document.getElementById("search").addEventListener("input", event => {
      query = event.target.value;
      renderSections();
    });

    setupPeriodSelect();
    render();
  </script>
</body>
</html>
